<!doctype html>
<html lang="so">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Guul-Wadaag</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f7f5;
color:#17221d;
}

header{
background:linear-gradient(135deg,#064e3b,#0b7a4d,#16a36a);
color:white;
padding:15px 5%;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
flex-wrap:wrap;
box-shadow:0 4px 20px #0002;
}

.logo{
font-size:23px;
font-weight:900;
letter-spacing:.5px;
}

nav{
display:flex;
gap:5px;
flex-wrap:wrap;
}

button{
border:0;
border-radius:9px;
padding:11px 15px;
background:#075b3a;
color:white;
font-weight:bold;
cursor:pointer;
transition:.2s;
}

button:hover{
opacity:.9;
transform:translateY(-1px);
}

nav button{
background:transparent;
}

.wrap{
max-width:1200px;
margin:auto;
padding:25px 5%;
}

.card{
background:white;
border-radius:16px;
padding:22px;
margin-bottom:18px;
box-shadow:0 4px 18px #0000000d;
}

.hidden{
display:none!important;
}

input,
select,
textarea{
width:100%;
padding:12px;
margin:6px 0 14px;
border:1px solid #ccd6d0;
border-radius:9px;
font-size:15px;
outline:none;
}

input:focus,
select:focus,
textarea:focus{
border-color:#0b7a4d;
box-shadow:0 0 0 3px #0b7a4d15;
}

textarea{
min-height:100px;
resize:vertical;
}

.login-card{
max-width:430px;
margin:60px auto;
}

.login-card h1{
color:#075b3a;
}

.link-btn{
background:none;
color:#075b3a;
padding:5px;
}

.error{
color:#b42318;
}

.success{
color:#087443;
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:18px;
margin-bottom:20px;
}

.stat{
background:white;
padding:22px;
border-radius:16px;
box-shadow:0 4px 18px #00000010;
border-top:4px solid #075b3a;
}

.stat-title{
color:#66756d;
font-size:14px;
}

.stat-number{
font-size:30px;
font-weight:900;
margin-top:8px;
color:#075b3a;
}

.grid{
display:grid;
grid-template-columns:2fr 1fr;
gap:20px;
}

.badge{
display:inline-block;
padding:5px 9px;
border-radius:20px;
background:#dff2e7;
color:#075b3a;
font-size:12px;
font-weight:bold;
}

.admin-badge{
background:#fff0c2;
color:#8a5a00;
}

.treasurer-badge{
background:#dceeff;
color:#075b3a;
}

.edit-btn{
background:#2563eb;
}

.delete-btn{
background:#dc2626;
}

.cancel-btn{
background:#6b7280;
}

.action{
display:flex;
gap:6px;
flex-wrap:wrap;
}

table{
width:100%;
border-collapse:collapse;
}

th,
td{
padding:11px;
text-align:left;
border-bottom:1px solid #e5e9e7;
}

th{
background:#edf4ef;
}

.search{
margin-bottom:15px;
}

.project{
border:1px solid #e5e9e7;
border-radius:12px;
padding:18px;
margin-bottom:12px;
}

.project img{
width:100%;
max-height:280px;
object-fit:cover;
border-radius:10px;
margin-bottom:12px;
}

.user-box{
background:linear-gradient(135deg,#e9f5ef,#f4fbf7);
padding:16px;
border-radius:12px;
margin-bottom:20px;
border:1px solid #d8eee1;
}

.private{
background:#fff4e5;
border-left:5px solid #e09b00;
padding:15px;
border-radius:8px;
margin-bottom:20px;
}

.dashboard-title{
background:linear-gradient(135deg,#064e3b,#087a4d,#16a36a);
color:white;
border-radius:20px;
padding:30px;
margin-bottom:20px;
