<!doctype html>
<html lang="so">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Guul-Wadaag</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f7f5;
color:#17221d;
}

.hidden{
display:none!important;
}

header{
background:#075b3a;
color:white;
padding:15px 5%;
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
flex-wrap:wrap;
}

.logo{
font-size:23px;
font-weight:800;
}

nav{
display:flex;
gap:6px;
flex-wrap:wrap;
}

nav button{
background:transparent;
padding:9px 11px;
}

button{
border:0;
border-radius:9px;
padding:11px 15px;
background:#075b3a;
color:white;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:.9;
}

.wrap{
max-width:1200px;
margin:auto;
padding:25px 5%;
}

.card{
background:white;
border-radius:15px;
padding:20px;
margin-bottom:18px;
box-shadow:0 4px 18px #0000000d;
}

.login-box{
max-width:450px;
margin:55px auto;
}

input,
select,
textarea{
width:100%;
padding:12px;
border:1px solid #ccd6d0;
border-radius:9px;
margin:6px 0 14px;
font-size:14px;
}

textarea{
min-height:100px;
resize:vertical;
}

label{
font-weight:bold;
font-size:14px;
}

h1{
color:#075b3a;
}

h2{
color:#075b3a;
}

.badge{
display:inline-block;
padding:5px 10px;
border-radius:20px;
background:#dff2e7;
color:#075b3a;
font-size:12px;
font-weight:bold;
}

.danger{
background:#dc2626;
}

.edit{
background:#2563eb;
}

.gray{
background:#6b7280;
}

.action{
display:flex;
gap:6px;
flex-wrap:wrap;
}

.message{
padding:11px;
border-radius:8px;
margin:10px 0;
background:#edf7f0;
color:#075b3a;
}

.error{
background:#fff0f0;
color:#b42318;
}


/* LOGIN */

.auth-tabs{
display:flex;
gap:5px;
margin-bottom:18px;
}

.auth-tabs button{
flex:1;
background:#e9efeb;
color:#075b3a;
}

.auth-tabs button.active{
background:#075b3a;
color:white;
}


/* DASHBOARD */

.dashboard-head{
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
flex-wrap:wrap;
margin-bottom:22px;
}

.dashboard-head h1{
margin:0 0 5px;
font-size:30px;
}

.dashboard-head p{
margin:0;
color:#68756e;
}

.user-box{
background:white;
padding:12px 15px;
border-radius:12px;
box-shadow:0 3px 15px #0000000c;
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:16px;
margin-bottom:20px;
}

.stat{
background:white;
border-radius:15px;
padding:20px;
box-shadow:0 4px 18px #0000000d;
border-left:5px solid #075b3a;
}

.stat-icon{
font-size:27px;
}

.stat-label{
color:#68756e;
font-size:13px;
margin-top:8px;
}

.stat-number{
font-size:28px;
font-weight:800;
margin-top:5px;
}

.dashboard-grid{
display:grid;
grid-template-columns:2fr 1fr;
gap:18px;
}

.quick{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.notice{
background:#edf7f0;
border-left:4px solid #075b3a;
padding:15px;
border-radius:9px;
}


/* TABLE */

.table-wrap{
overflow-x:auto;
}

table{
width:100%;
border-collapse:collapse;
}

th,
td{
padding:12px;
border-bottom:1px solid #e5e9e7;
text-align:left;
white-space:nowrap;
}

th{
background:#edf4ef;
color:#075b3a;
}


/* PROJECTS */

.project-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:18px;
}

.project-card{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 4px 18px #0000000d;
}

.project-image{
width:100%;
height:200px;
object-fit:cover;
background:#e8eeea;
display:block;
}

.project-content{
padding:17px;
}

.project-content h3{
margin-top:0;
color:#075b3a;
}

.project-content p{
color:#5e6d65;
line-height:1.6;
}

.search{
margin-bottom:15px;
}


/* UPLOAD */

.image-preview{
width:100%;
max-height:220px;
object-fit:cover;
border-radius:12px;
margin:10px 0;
display:none;
}


/* ADMIN */

.admin-only{
display:none;
}

body.is-admin .admin-only{
display:block;
}

.admin-flex{
display:none;
}

body.is-admin .admin-flex{
display:flex;
}

@media
